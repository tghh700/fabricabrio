name: teste-instagram
on:
  push:
    branches: [main]
    paths: ["scripts/teste_instagram.py", ".github/workflows/teste-instagram.yml"]
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testar tokens (nunca imprime o token)
        env:
          IG_TOKEN_BRIO: ${{ secrets.IG_TOKEN_BRIO }}
          IG_TOKEN_FIBRA: ${{ secrets.IG_TOKEN_FIBRA }}
          IG_TOKEN_DIAUM: ${{ secrets.IG_TOKEN_DIAUM }}
          IG_ID_BRIO: "17841418207775427"
          IG_ID_DIAUM: "17841456016332755"
        run: python scripts/teste_instagram.py
      - name: Gravar resultado no D1
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute fabrica-brio --remote --file ../resultado_teste.sql
