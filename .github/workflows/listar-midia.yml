name: listar-midia
on:
  push:
    branches: [main]
    paths: ["scripts/listar_midia.py", ".github/workflows/listar-midia.yml", "jobs/listar.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  listar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - env:
          IG_TOKEN_BRIO: ${{ secrets.IG_TOKEN_BRIO }}
          IG_TOKEN_FIBRA: ${{ secrets.IG_TOKEN_FIBRA }}
          IG_TOKEN_DIAUM: ${{ secrets.IG_TOKEN_DIAUM }}
        run: python3 scripts/listar_midia.py
      - working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute fabrica-brio --remote --file ../midia.sql
      - name: Publicar lista completa e miniaturas no branch previas
        run: |
          git config user.name "fabrica-bot"
          git config user.email "fabrica-bot@users.noreply.github.com"
          mkdir -p /tmp/m && cp -r saida/midia /tmp/m/
          git fetch --depth 1 origin previas && git checkout -B previas FETCH_HEAD
          rm -rf midia && cp -r /tmp/m/midia midia
          git add -A && git commit -qm "midia publicada" && git push origin previas
